<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班卡拉科技 - 行動打卡系統</title>
    <!-- 引入 LINE LIFF SDK -->
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            text-align: center; 
            padding: 20px; 
            background-color: #f4f7f6; 
            margin: 0;
        }
        .container { 
            max-width: 400px; 
            margin: 40px auto; 
            background: white; 
            padding: 30px 20px; 
            border-radius: 16px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.08); 
        }
        h2 { color: #2c3e50; margin-bottom: 10px; }
        .subtitle { color: #7f8c8d; font-size: 14px; margin-bottom: 25px; }
        .status-box { 
            background: #f8f9fa; 
            border: 1px solid #e9ecef; 
            padding: 15px; 
            border-radius: 8px; 
            margin-bottom: 20px; 
            font-size: 15px; 
            color: #333;
        }
        .btn { 
            background-color: #27ae60; 
            color: white; 
            border: none; 
            padding: 14px 20px; 
            font-size: 16px; 
            font-weight: bold;
            border-radius: 8px; 
            cursor: pointer; 
            width: 100%; 
            box-shadow: 0 4px 6px rgba(39, 174, 96, 0.2);
            transition: background 0.2s;
        }
        .btn:active { background-color: #219653; }
        .btn:disabled { background-color: #bdc3c7; box-shadow: none; cursor: not-allowed; }
        .success { color: #27ae60; font-weight: bold; }
        .error { color: #c0392b; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h2 id="pageTitle">班卡拉科技打卡</h2>
        <div class="subtitle">Bankala Tech Attendance System</div>
        
        <div id="status" class="status-box">正在初始化定位與驗證身份...</div>
        
        <button id="submitBtn" class="btn" style="display:none;" onclick="doCheckIn()">確認送出打卡</button>
    </div>

    <script>
        // ================= 請修改以下兩個參數 =================
        const LIFF_ID = '2012066516-Kgq3FzLB'; // 請填入您在 LINE Developers 建立的 LIFF ID
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbzIrcPlFz1vyiA_XuLoEqoWz0zwNBJH0u0-k3KZm7RAJutFhN2vwuVcG2nEtZahikfE/exec'; // 請填入您 Google Apps Script 的 Web App 網址
        // ======================================================

        let userLat = null;
        let userLng = null;
        let userId = null;
        let checkType = '上班'; // 預設

        window.onload = function() {
            // 解析網址參數判斷是上班還是下班 (例如: ?type=in 或 ?type=out)
            const urlParams = new URLSearchParams(window.location.search);
            const typeParam = urlParams.get('type');
            
            if (typeParam === 'out') {
                checkType = '下班';
                document.getElementById('pageTitle').innerText = '班卡拉科技 - 下班打卡';
            } else {
                checkType = '上班';
                document.getElementById('pageTitle').innerText = '班卡拉科技 - 上班打卡';
            }

            initializeLiff();
        };

        function initializeLiff() {
            liff.init({ liffId: LIFF_ID })
                .then(() => {
                    if (!liff.isLoggedIn()) {
                        liff.login();
                    } else {
                        getProfileAndLocation();
                    }
                })
                .catch((err) => {
                    document.getElementById('status').innerText = 'LIFF 初始化失敗: ' + err;
                    document.getElementById('status').className = 'status-box error';
                });
        }

        function getProfileAndLocation() {
            // 1. 取得 LINE 用戶資料
            liff.getProfile().then(profile => {
                userId = profile.userId;
                
                // 2. 取得手機 GPS 經緯度
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        (position) => {
                            userLat = position.coords.latitude;
                            userLng = position.coords.longitude;
                            document.getElementById('status').innerHTML = `📍 <b>定位成功！</b><br>已取得您的目前位置，可點擊下方按鈕完成${checkType}打卡。`;
                            document.getElementById('status').className = 'status-box success';
                            document.getElementById('submitBtn').style.display = 'block';
                        },
                        (error) => {
                            document.getElementById('status').innerText = '無法取得手機 GPS 定位，請確認手機瀏覽器的定位權限已開啟。';
                            document.getElementById('status').className = 'status-box error';
                        },
                        { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
                    );
                } else {
                    document.getElementById('status').innerText = '您的裝置不支援地理定位功能。';
                    document.getElementById('status').className = 'status-box error';
                }
            }).catch(err => {
                document.getElementById('status').innerText = '無法讀取 LINE 用戶資訊。';
                document.getElementById('status').className = 'status-box error';
            });
        }

        function doCheckIn() {
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            document.getElementById('status').innerText = '正在傳送打卡資料至伺服器...';

            const payload = {
                action: checkType === '上班' ? 'clockIn' : 'clockOut',
                userId: userId,
                type: checkType,
                lat: userLat,
                lng: userLng
            };

            fetch(GAS_URL, {
                method: 'POST',
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    document.getElementById('status').innerHTML = `✅ <b>${checkType}打卡成功！</b><br>距離公司約 ${data.distance} 公尺<br><span style="font-size:12px;color:#7f8c8d;">視窗將在 3 秒後自動關閉</span>`;
                    document.getElementById('status').className = 'status-box success';
                    
                    // 打卡成功 3 秒後自動關閉 LIFF 視窗
                    setTimeout(() => {
                        liff.closeWindow();
                    }, 3000);
                } else {
                    document.getElementById('status').innerText = '打卡失敗: ' + (data.message || '未知錯誤');
                    document.getElementById('status').className = 'status-box error';
                    btn.disabled = false;
                }
            })
            .catch(err => {
                document.getElementById('status').innerText = '連線伺服器失敗，請稍後再試。';
                document.getElementById('status').className = 'status-box error';
                btn.disabled = false;
            });
        }
    </script>
</body>
</html>
